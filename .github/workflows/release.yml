name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAGS="-t ghcr.io/matszwe02/ytdlp_web_player:$TAG -t matszwe02/ytdlp_web_player:$TAG"
          if [ "$PRERELEASE" != "true" ]; then
            TAGS="$TAGS -t ghcr.io/matszwe02/ytdlp_web_player:stable -t matszwe02/ytdlp_web_player:stable"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 $TAGS --push .
